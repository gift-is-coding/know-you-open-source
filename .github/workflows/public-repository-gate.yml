name: Public Repository Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-repository-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    name: Public boundary and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/gitleaks.tar.gz
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Test public synchronization contract
        run: bash scripts/test-public-repo-sync.sh

      - name: Verify current public tree
        run: scripts/verify-public-repo.sh --root .

      - name: Scan complete public history
        run: >-
          gitleaks git .
          --config .gitleaks.toml
          --gitleaks-ignore-path .gitleaksignore
          --redact
          --no-banner

  macos-app:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Test
        run: xcodebuild test -scheme KnowYou -destination 'platform=macOS'

      - name: Build
        run: xcodebuild build -scheme KnowYou -destination 'platform=macOS'

      - name: Analyze
        run: xcodebuild analyze -scheme KnowYou -destination 'platform=macOS'

  networking-web:
    name: Networking Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: NetworkingWeb
    env:
      NETWORKING_IGNORE_ENV_LOCAL: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-open-source-ci
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: NetworkingWeb/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  my-wiki:
    name: My Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ThirdParty/llm_wiki
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ThirdParty/llm_wiki/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:mocks
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Check Rust backend
        working-directory: ThirdParty/llm_wiki/src-tauri
        run: cargo check --locked
      - name: Test Rust backend
        working-directory: ThirdParty/llm_wiki/src-tauri
        run: cargo test --locked

  my-wiki-mcp:
    name: My Wiki MCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Tools/MyWikiMCP
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tools/MyWikiMCP/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
