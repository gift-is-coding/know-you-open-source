<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f6f7f8; }
      .window { fill: #fbfbfc; stroke: #d8dde3; stroke-width: 1; }
      .toolbar { fill: #f1f3f5; stroke: #d6dbe1; stroke-width: 1; }
      .sidebar { fill: #eef1f4; }
      .content { fill: #ffffff; }
      .detail { fill: #f9fafb; }
      .line { stroke: #d8dde3; stroke-width: 1; }
      .muted { fill: #667085; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      .text { fill: #182230; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      .title { fill: #101828; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-weight: 700; }
      .small { font-size: 18px; }
      .body { font-size: 22px; }
      .label { font-size: 20px; font-weight: 600; }
      .h1 { font-size: 30px; font-weight: 700; }
      .h2 { font-size: 24px; font-weight: 700; }
      .button { fill: #ffffff; stroke: #cfd6dd; stroke-width: 1; }
      .primary { fill: #2563eb; }
      .danger { fill: #fee4e2; stroke: #fda29b; stroke-width: 1; }
      .dangerText { fill: #b42318; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      .warn { fill: #fffbeb; stroke: #f5c451; stroke-width: 1.5; }
      .warnStrong { fill: #f79009; }
      .ok { fill: #12b76a; }
      .gray { fill: #98a2b3; }
      .yellow { fill: #fdb022; }
      .pill { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1; }
      .callout { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1680" height="1080"/>

  <text class="title h1" x="80" y="78">Diary Engine recovery nudge - design draft</text>
  <text class="muted body" x="80" y="116">Goal: after onboarding, users can keep browsing, while the top-right engine control clearly asks them to add or repair an engine.</text>

  <g transform="translate(80 160)" filter="url(#shadow)">
    <rect class="window" x="0" y="0" width="980" height="680" rx="14"/>
    <rect class="toolbar" x="0" y="0" width="980" height="62" rx="14"/>
    <rect class="toolbar" x="0" y="40" width="980" height="22"/>
    <circle cx="26" cy="31" r="7" fill="#ff5f57"/>
    <circle cx="48" cy="31" r="7" fill="#ffbd2e"/>
    <circle cx="70" cy="31" r="7" fill="#28c840"/>

    <rect class="sidebar" x="0" y="62" width="220" height="618"/>
    <line class="line" x1="220" y1="62" x2="220" y2="680"/>
    <rect class="content" x="220" y="62" width="430" height="618"/>
    <line class="line" x1="650" y1="62" x2="650" y2="680"/>
    <rect class="detail" x="650" y="62" width="330" height="618"/>

    <text class="text label" x="250" y="112">My Diary</text>
    <text class="title h1" x="250" y="182">今天的日记</text>
    <rect x="250" y="222" width="350" height="16" rx="8" fill="#e5e7eb"/>
    <rect x="250" y="260" width="330" height="16" rx="8" fill="#e5e7eb"/>
    <rect x="250" y="298" width="360" height="16" rx="8" fill="#e5e7eb"/>
    <rect x="250" y="360" width="300" height="16" rx="8" fill="#e5e7eb"/>
    <rect x="250" y="398" width="365" height="16" rx="8" fill="#e5e7eb"/>

    <text class="muted small" x="24" y="116">May 2026</text>
    <rect x="20" y="148" width="180" height="34" rx="8" fill="#ffffff"/>
    <text class="text small" x="36" y="171">Today</text>
    <rect x="20" y="196" width="160" height="12" rx="6" fill="#d0d5dd"/>
    <rect x="20" y="224" width="132" height="12" rx="6" fill="#d0d5dd"/>
    <rect x="20" y="252" width="170" height="12" rx="6" fill="#d0d5dd"/>

    <text class="muted label" x="690" y="116">Sources</text>
    <rect x="690" y="150" width="230" height="56" rx="10" fill="#ffffff" stroke="#e4e7ec"/>
    <rect x="690" y="222" width="210" height="56" rx="10" fill="#ffffff" stroke="#e4e7ec"/>

    <g transform="translate(700 15)">
      <rect class="callout" x="-10" y="-8" width="256" height="44" rx="12"/>
      <circle cx="12" cy="14" r="6" class="yellow"/>
      <text class="dangerText label" x="28" y="21">Add Diary Engine</text>
    </g>

    <g transform="translate(704 64)">
      <path d="M126 0 L140 18 L112 18 Z" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
      <rect class="callout" x="-40" y="17" width="318" height="96" rx="14"/>
      <text class="dangerText label" x="-14" y="52">没有可用的 Diary Engine</text>
      <text class="muted small" x="-14" y="82">生成/刷新需要先连接 engine。</text>
      <rect class="primary" x="174" y="70" width="80" height="28" rx="7"/>
      <text fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, sans-serif" font-size="16" font-weight="700" x="190" y="90">Setup</text>
    </g>
  </g>

  <g transform="translate(1110 160)" filter="url(#shadow)">
    <rect class="window" x="0" y="0" width="490" height="340" rx="16"/>
    <text class="title h2" x="28" y="48">State A: onboarding 完成但没配置</text>
    <rect class="warn" x="28" y="74" width="434" height="70" rx="12"/>
    <circle class="yellow" cx="54" cy="109" r="8"/>
    <text class="dangerText label" x="74" y="104">Choose a Diary Engine</text>
    <text class="muted small" x="74" y="129">连接任意 engine 后，才能生成和刷新日记。</text>

    <g transform="translate(28 170)">
      <rect class="pill" x="0" y="0" width="434" height="58" rx="12"/>
      <circle class="gray" cx="28" cy="29" r="7"/>
      <text class="text label" x="48" y="25">Codex Auth</text>
      <text class="muted small" x="48" y="48">Credentials not found.</text>
      <rect class="button" x="334" y="16" width="70" height="28" rx="7"/>
      <text class="text small" x="353" y="36">Test</text>
    </g>

    <g transform="translate(28 238)">
      <rect class="pill" x="0" y="0" width="434" height="58" rx="12"/>
      <circle class="gray" cx="28" cy="29" r="7"/>
      <text class="text label" x="48" y="25">LLM API</text>
      <text class="muted small" x="48" y="48">API configuration is incomplete.</text>
      <rect class="primary" x="300" y="16" width="104" height="28" rx="7"/>
      <text fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, sans-serif" font-size="16" font-weight="700" x="318" y="36">Configure</text>
    </g>
  </g>

  <g transform="translate(1110 540)" filter="url(#shadow)">
    <rect class="window" x="0" y="0" width="490" height="360" rx="16"/>
    <text class="title h2" x="28" y="48">State B: 使用中 engine 全部失败</text>
    <rect class="danger" x="28" y="74" width="434" height="78" rx="12"/>
    <circle fill="#f04438" cx="54" cy="112" r="8"/>
    <text class="dangerText label" x="74" y="106">Diary Engine needs attention</text>
    <text class="muted small" x="74" y="132">默认 engine 失败；没有 green 备选。</text>

    <g transform="translate(28 178)">
      <rect class="pill" x="0" y="0" width="434" height="58" rx="12"/>
      <circle fill="#f04438" cx="28" cy="29" r="7"/>
      <text class="text label" x="48" y="25">Codex (CLI)</text>
      <text class="muted small" x="48" y="48">Smoke test failed: auth expired.</text>
      <text class="dangerText small" x="318" y="36">Default</text>
    </g>

    <g transform="translate(28 246)">
      <rect class="pill" x="0" y="0" width="434" height="58" rx="12"/>
      <circle class="gray" cx="28" cy="29" r="7"/>
      <text class="text label" x="48" y="25">LLM API</text>
      <text class="muted small" x="48" y="48">API configuration is incomplete.</text>
      <rect class="primary" x="300" y="16" width="104" height="28" rx="7"/>
      <text fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, sans-serif" font-size="16" font-weight="700" x="318" y="36">Configure</text>
    </g>

    <text class="muted small" x="28" y="336">Footer: Retest All + Configure. 不自动切到 None。</text>
  </g>

  <g transform="translate(80 890)">
    <rect fill="#ffffff" stroke="#d8dde3" x="0" y="0" width="1520" height="120" rx="14"/>
    <text class="title h2" x="28" y="42">Recommended behavior</text>
    <text class="text small" x="28" y="76">1. Onboarding 后允许 engine 为空，但 toolbar engine button 进入黄色强调态，并显示一次轻量 callout。</text>
    <text class="text small" x="28" y="102">2. 默认 engine 失败且无 green 备选时，按钮继续高亮；popover 提供 Retest All 和 Configure。</text>
    <text class="text small" x="850" y="102">3. 失败时保留原默认 engine，不悄悄改用户配置。</text>
  </g>
</svg>
